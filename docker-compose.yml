services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spotify-hybrid-rag-backend
    env_file:
      - ./backend/.env
    expose:
      - "8000"
    volumes:
      - rag_storage:/app/storage
    restart: unless-stopped

  frontend:
      build:
        context: ./frontend
        dockerfile: Dockerfile
        args:
          VITE_API_BASE_URL: ""
      container_name: spotify-hybrid-rag-frontend
      ports:
        - "127.0.0.1:8080:80"
        - "127.0.0.1:8443:443"
      volumes:
        - /etc/letsencrypt:/etc/letsencrypt:ro
      depends_on:
        - backend
      restart: unless-stopped

volumes:
  rag_storage: