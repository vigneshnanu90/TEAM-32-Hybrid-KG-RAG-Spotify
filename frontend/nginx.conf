cat <<'EOF' > /opt/apps/TEAM-32-Hybrid-KG-RAG-Spotify/frontend/nginx.conf
server {
    listen 80;
    server_name team-32.vickycore.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name team-32.vickycore.io;

    ssl_certificate /etc/letsencrypt/live/team-32.vickycore.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/team-32.vickycore.io/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50M;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
EOF

cat <<'EOF' > /opt/apps/TEAM-32-Hybrid-KG-RAG-Spotify/docker-compose.yml
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spotify-hybrid-rag-backend
    env_file:
      - ./backend/.env
    expose:
      - "8000"
    volumes:
      - rag_storage:/app/storage
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    container_name: spotify-hybrid-rag-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  rag_storage:
EOF

cd /opt/apps/TEAM-32-Hybrid-KG-RAG-Spotify
docker compose up --build -d